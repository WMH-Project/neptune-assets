# Hébergement des visuels sur cdn.mission-neptune.com (remplace jsDelivr).
# Netlify redéploie à chaque fusion sur main ; une pull request reçoit une URL d'aperçu.
#
# Seuls les dossiers de visuels sont publiés — pas les scripts ni les documents.
# Les chemins sont ceux du dépôt, sans numéro de version :
#   https://cdn.mission-neptune.com/photos/newsletter/<campagne>/<fichier>
# Conséquence : un fichier publié ne se modifie pas (check_assets.py le bloque),
# une correction se publie sous un nouveau nom. Dérogation possible pour le
# mainteneur (push.sh --allow-modify) : d'où un cache d'un jour, pas d'un an,
# pour qu'un remplacement finisse par arriver chez ceux qui avaient l'ancien.

[build]
  command = "rm -rf _site && mkdir _site && cp -R photos logos graphics posters reports _site/ && find _site -name '*.md' -delete"
  publish = "_site"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"
