# Rejoue check_assets.py sur chaque pull request et chaque push sur main :
# poids par image, emplacement et type des fichiers, aucun visuel publié modifié ou supprimé.
name: Contrôle des assets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # il faut les tags : la base de comparaison est le dernier tag
      - name: check_assets.py
        # [allow-modify] / [allow-delete] dans le message de commit = dérogation posée par push.sh
        run: |
          flags=""
          msg=$(git log -1 --format=%B)
          case "$msg" in *"[allow-modify]"*) flags="$flags --allow-modify" ;; esac
          case "$msg" in *"[allow-delete]"*) flags="$flags --allow-delete" ;; esac
          python3 check_assets.py --target HEAD $flags
